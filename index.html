<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>files // ÞERXWOLD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;450;500&family=JetBrains+Mono:wght@400;450;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #0d0d0f;
      --surface-hover: #111114;
      --text: #e9e7e4;
      --muted: #77777f;
      --quiet: #4e4e55;
      --line: #232328;
      --line-strong: #323238;
      --accent: #dc7d9b;
      --font: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --max: 1120px;
    }

    * { box-sizing: border-box; }

    html {
      background:
        radial-gradient(circle at 88% -18%, rgba(220, 125, 155, 0.055), transparent 30rem),
        var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a { color: inherit; text-decoration: none; }
    button,
    input { font: inherit; }
    button { cursor: pointer; }
    ::selection { background: var(--accent); color: #0a0a0b; }

    :focus-visible {
      outline: 1px solid #8f5366;
      outline-offset: 3px;
    }

    .page {
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .topbar {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: 11px;
    }

    .brand,
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .top-actions {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      color: var(--text);
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .slash { color: var(--quiet); }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(220, 125, 155, 0.32);
    }

    .login {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      transition: 140ms ease;
    }

    .login::before {
      content: "→";
      color: var(--accent);
    }

    .login:hover {
      border-color: var(--line-strong);
      background: var(--surface-hover);
      color: var(--text);
    }

    .hero {
      padding: 88px 0 46px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5.2vw, 62px);
      line-height: 1;
      font-weight: 450;
      letter-spacing: -0.065em;
    }

    .accent { color: var(--accent); }

    .intro {
      max-width: 560px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      min-height: 58px;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .path {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .path-prefix { color: var(--quiet); }
    .path-current { color: var(--text); }

    .tools {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search {
      position: relative;
      width: clamp(170px, 20vw, 230px);
      flex: 0 1 230px;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 10px;
      width: 13px;
      height: 13px;
      transform: translateY(-50%);
      color: var(--quiet);
      pointer-events: none;
    }

    .search-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
    }

    .search-input {
      width: 100%;
      min-height: 30px;
      padding: 0 31px;
      border: 1px solid var(--line);
      border-radius: 5px;
      outline: none;
      background: rgba(13, 13, 15, 0.72);
      color: var(--text);
      font-size: 11px;
      transition: 140ms ease;
    }

    .search-input::placeholder { color: var(--quiet); }

    .search-input:focus {
      border-color: #5a3944;
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(220, 125, 155, 0.055);
    }

    .search-key {
      position: absolute;
      top: 50%;
      right: 8px;
      min-width: 15px;
      height: 17px;
      border: 1px solid var(--line);
      border-radius: 3px;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      color: var(--quiet);
      font-size: 9px;
      line-height: 1;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    .search:focus-within .search-key,
    .search-input:not(:placeholder-shown) + .search-key { opacity: 0; }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .action {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: 140ms ease;
    }

    .action:hover {
      border-color: var(--line-strong);
      background: var(--surface-hover);
      color: var(--text);
    }

    .action.primary {
      border-color: #3d2a31;
      color: #e6a0b6;
    }

    .action.primary:hover {
      border-color: #6e3d4d;
      background: #160f12;
      color: #f0b2c5;
    }

    .file-head,
    .file-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 110px 150px;
      gap: 20px;
      align-items: center;
      padding: 0 12px;
    }

    .file-head {
      min-height: 38px;
      border-bottom: 1px solid var(--line);
      color: var(--quiet);
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    .file-list {
      border-bottom: 1px solid var(--line-strong);
    }

    .file-row[hidden] { display: none; }

    .file-row {
      width: 100%;
      min-height: 56px;
      border-top: 0;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      border-left: 0;
      appearance: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      position: relative;
      transition: background 140ms ease;
    }

    .file-row:last-of-type { border-bottom: 0; }

    .file-row:hover,
    .file-row:focus-visible {
      background: linear-gradient(90deg, rgba(220, 125, 155, 0.055), rgba(220, 125, 155, 0.012) 65%, transparent);
    }

    .file-row:focus-visible {
      outline: 1px solid #6e3d4d;
      outline-offset: -1px;
    }

    .name {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: grid;
      place-items: center;
      color: var(--quiet);
      transition: color 140ms ease, transform 140ms ease;
    }

    .icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .filename {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: -0.02em;
      transition: color 140ms ease;
    }

    .folder .filename { color: #f0eeeb; }
    .folder .icon { color: var(--accent); }

    .file-row:hover .filename,
    .file-row:focus-visible .filename { color: #fff; }

    .file-row:hover .icon,
    .file-row:focus-visible .icon {
      color: #e6a0b6;
      transform: translateX(2px);
    }

    .size,
    .modified {
      color: var(--muted);
      font-size: 11px;
    }

    .empty-state {
      min-height: 110px;
      display: grid;
      place-items: center;
      color: var(--quiet);
      font-size: 11px;
      text-align: center;
    }

    .empty-state[hidden] { display: none; }
    .empty-query { color: var(--muted); }

    .footer {
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--quiet);
      font-size: 10px;
    }

    .footer-command {
      color: var(--muted);
    }

    .footer-command::before {
      content: ">";
      margin-right: 8px;
      color: var(--accent);
    }

    @media (max-width: 720px) {
      .page { width: min(calc(100% - 28px), var(--max)); }
      .hero { padding: 64px 0 34px; }

      .toolbar {
        padding: 13px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .tools { width: 100%; }
      .search { width: auto; flex: 1 1 auto; }

      .file-head,
      .file-row {
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 14px;
      }

      .file-head > :last-child,
      .file-row > :last-child { display: none; }

      .footer {
        flex-direction: column;
        gap: 5px;
      }
    }

    @media (max-width: 460px) {
      .status-label { display: none; }
      .top-actions { gap: 8px; }
      .intro { max-width: 36ch; }
      .action span.label { display: none; }
      .action { width: 32px; padding: 0; justify-content: center; }
      .tools { gap: 7px; }
      .actions { gap: 6px; }
      .file-head,
      .file-row { grid-template-columns: minmax(0, 1fr) 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">ÞERXWOLD</span>
        <span class="slash">/</span>
        <span>files</span>
      </div>

      <div class="top-actions">
        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-label">public node</span>
        </div>
        <a class="login" href="/login">log in</a>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">~/archive</p>
      <h1>file<span class="accent">.</span>manager</h1>
      <p class="intro">a quiet place for files, builds and things worth keeping around.</p>
    </section>

    <section aria-label="File browser">
      <div class="toolbar">
        <div class="path" aria-label="Current path">
          <span class="path-prefix">naru@wold:</span>
          <span class="path-current">~/uploads/</span>
        </div>

        <div class="tools">
          <label class="search">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
            </span>
            <input class="search-input" id="file-search" type="search" placeholder="search files" aria-label="Search files" autocomplete="off" />
            <span class="search-key" aria-hidden="true">/</span>
          </label>

          <div class="actions">
            <button class="action" type="button" aria-label="New folder">
              <span>+</span><span class="label">folder</span>
            </button>
            <button class="action primary" type="button" aria-label="Upload file">
              <span>↑</span><span class="label">upload</span>
            </button>
          </div>
        </div>
      </div>

      <div class="file-head" aria-hidden="true">
        <span>name</span>
        <span>size</span>
        <span>modified</span>
      </div>

      <div class="file-list">
        <button class="file-row folder" type="button" data-file data-name="builds">
          <span class="name">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l2 2h9v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 7.5v-2a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v2"/></svg>
            </span>
            <span class="filename">builds</span>
          </span>
          <span class="size">—</span>
          <span class="modified">today, 02:14</span>
        </button>

        <button class="file-row folder" type="button" data-file data-name="screenshots">
          <span class="name">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l2 2h9v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 7.5v-2a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v2"/></svg>
            </span>
            <span class="filename">screenshots</span>
          </span>
          <span class="size">—</span>
          <span class="modified">08 aug</span>
        </button>

        <button class="file-row" type="button" data-file data-name="therxwold-release.zip">
          <span class="name">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/></svg>
            </span>
            <span class="filename">therxwold-release.zip</span>
          </span>
          <span class="size">18.4 mb</span>
          <span class="modified">07 aug</span>
        </button>

        <button class="file-row" type="button" data-file data-name="notes.txt">
          <span class="name">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/></svg>
            </span>
            <span class="filename">notes.txt</span>
          </span>
          <span class="size">4.2 kb</span>
          <span class="modified">02 aug</span>
        </button>

        <button class="file-row" type="button" data-file data-name="void_004.png">
          <span class="name">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="m7 15 3.2-3.2 2.4 2.4 2.1-2.1L18 15.5"/><circle cx="8.5" cy="8.5" r="1"/></svg>
            </span>
            <span class="filename">void_004.png</span>
          </span>
          <span class="size">812 kb</span>
          <span class="modified">28 jul</span>
        </button>

        <button class="file-row" type="button" data-file data-name="archive.db">
          <span class="name">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/></svg>
            </span>
            <span class="filename">archive.db</span>
          </span>
          <span class="size">2.1 mb</span>
          <span class="modified">13 jul</span>
        </button>

        <div class="empty-state" id="empty-state" hidden>
          <span>no files matching <span class="empty-query" id="empty-query"></span></span>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span class="footer-command"><span id="visible-count">6</span> <span id="entry-label">entries</span> / 21.3 mb</span>
      <span>ÞERXWOLD // FILE NODE 01</span>
    </footer>
  </main>

  <script>
    const searchInput = document.querySelector("#file-search");
    const files = [...document.querySelectorAll("[data-file]")];
    const emptyState = document.querySelector("#empty-state");
    const emptyQuery = document.querySelector("#empty-query");
    const visibleCount = document.querySelector("#visible-count");
    const entryLabel = document.querySelector("#entry-label");

    function filterFiles() {
      const query = searchInput.value.trim().toLowerCase();
      let matches = 0;

      files.forEach((file) => {
        const isMatch = file.dataset.name.toLowerCase().includes(query);
        file.hidden = !isMatch;
        if (isMatch) matches += 1;
      });

      visibleCount.textContent = matches;
      entryLabel.textContent = matches === 1 ? "entry" : "entries";
      emptyState.hidden = matches !== 0;
      emptyQuery.textContent = query ? `“${searchInput.value.trim()}”` : "";
    }

    searchInput.addEventListener("input", filterFiles);

    document.addEventListener("keydown", (event) => {
      const isTyping = /input|textarea/i.test(document.activeElement.tagName);

      if (event.key === "/" && !isTyping) {
        event.preventDefault();
        searchInput.focus();
      }

      if (event.key === "Escape" && document.activeElement === searchInput) {
        searchInput.value = "";
        filterFiles();
        searchInput.blur();
      }
    });
  </script>
</body>
</html>
