<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>files // ÞERXWOLD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;450;500&family=JetBrains+Mono:wght@400;450;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #0d0d0f;
      --surface-hover: #111114;
      --text: #e9e7e4;
      --muted: #77777f;
      --quiet: #4e4e55;
      --line: #232328;
      --line-strong: #323238;
      --accent: #dc7d9b;
      --font: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --max: 1120px;
    }

    * { box-sizing: border-box; }

    html {
      background:
        radial-gradient(circle at 88% -18%, rgba(220, 125, 155, 0.055), transparent 30rem),
        var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a { color: inherit; text-decoration: none; }
    button,
    input { font: inherit; }
    button { cursor: pointer; }
    ::selection { background: var(--accent); color: #0a0a0b; }

    :focus-visible {
      outline: 1px solid #8f5366;
      outline-offset: 3px;
    }

    .page {
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .topbar {
      min-height: 42px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(35, 35, 40, 0.72);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: 11px;
    }

    .brand,
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .top-actions {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      color: var(--text);
      font-weight: 500;
      letter-spacing: -0.045em;
    }

    .brand-project {
      margin-right: 2px;
      color: var(--quiet);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .brand-thorn {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(220, 125, 155, 0.3);
    }

    .slash { color: var(--quiet); }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(220, 125, 155, 0.32);
    }

    .login {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      transition: 140ms ease;
    }

    .login:hover {
      border-color: var(--line-strong);
      background: var(--surface-hover);
      color: var(--text);
    }

    .pixel-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      display: block;
      shape-rendering: crispEdges;
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .login .pixel-icon {
      --icon-main: var(--accent);
      --icon-light: #e6a0b6;
      --icon-dark: #6e3d4d;
    }

    .hero {
      padding: 58px 0 40px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.02em;
    }

    .eyebrow::before {
      content: "[";
      margin-right: 1px;
      color: var(--accent);
    }

    .eyebrow::after {
      content: "]";
      margin-left: 1px;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.04;
      font-weight: 450;
      letter-spacing: -0.06em;
    }

    .title-prefix {
      margin-right: 0.2em;
      color: var(--quiet);
      font-size: 0.48em;
      font-weight: 400;
      letter-spacing: 0;
      vertical-align: 0.38em;
    }

    .accent { color: var(--accent); }

    .intro {
      max-width: 560px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .intro::before {
      content: "// ";
      color: var(--quiet);
    }

    .toolbar {
      min-height: 58px;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .path {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .path-prefix { color: var(--quiet); }
    .path-current { color: var(--text); }

    .tools {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search {
      position: relative;
      width: clamp(170px, 20vw, 230px);
      flex: 0 1 230px;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 10px;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      color: var(--quiet);
      pointer-events: none;
    }

    .search-icon .pixel-icon {
      width: 100%;
      height: 100%;
      --icon-main: var(--quiet);
      --icon-light: var(--muted);
      --icon-dark: var(--line-strong);
    }

    .search-input {
      width: 100%;
      min-height: 30px;
      padding: 0 31px;
      border: 1px solid var(--line);
      border-radius: 5px;
      outline: none;
      background: rgba(13, 13, 15, 0.72);
      color: var(--text);
      font-size: 11px;
      transition: 140ms ease;
    }

    .search-input::placeholder { color: var(--quiet); }

    .search-input:focus {
      border-color: #5a3944;
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(220, 125, 155, 0.055);
    }

    .search-key {
      position: absolute;
      top: 50%;
      right: 8px;
      min-width: 15px;
      height: 17px;
      border: 1px solid var(--line);
      border-radius: 3px;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      color: var(--quiet);
      font-size: 9px;
      line-height: 1;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    .search:focus-within .search-key,
    .search-input:not(:placeholder-shown) + .search-key { opacity: 0; }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .action {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: 140ms ease;
    }

    .action:hover {
      border-color: var(--line-strong);
      background: var(--surface-hover);
      color: var(--text);
    }

    .action.primary {
      border-color: #3d2a31;
      color: #e6a0b6;
    }

    .action.primary:hover {
      border-color: #6e3d4d;
      background: #160f12;
      color: #f0b2c5;
    }

    .action .pixel-icon {
      --icon-main: #9474b8;
      --icon-light: #c3a0dc;
      --icon-dark: var(--accent);
    }

    .action.primary .pixel-icon {
      --icon-main: #bc6984;
      --icon-light: #efb0c4;
      --icon-dark: #704052;
    }

    .file-head,
    .file-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 110px 150px;
      gap: 20px;
      align-items: center;
      padding: 0 12px;
    }

    .file-head {
      min-height: 38px;
      border-bottom: 1px solid var(--line);
      color: var(--quiet);
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    .file-list {
      border-bottom: 1px solid var(--line-strong);
    }

    .file-row[hidden] { display: none; }

    .file-row {
      width: 100%;
      min-height: 56px;
      border-top: 0;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      border-left: 0;
      appearance: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      position: relative;
      transition: background 140ms ease;
    }

    .file-row:last-of-type { border-bottom: 0; }

    .file-row:hover,
    .file-row:focus-visible {
      background: linear-gradient(90deg, rgba(220, 125, 155, 0.055), rgba(220, 125, 155, 0.012) 65%, transparent);
    }

    .file-row:focus-visible {
      outline: 1px solid #6e3d4d;
      outline-offset: -1px;
    }

    .name {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: grid;
      place-items: center;
      color: var(--quiet);
      transition: color 140ms ease, transform 140ms ease;
    }

    .icon svg {
      width: 16px;
      height: 16px;
    }

    .filename {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: -0.02em;
      transition: color 140ms ease;
    }

    .folder .filename { color: #f0eeeb; }

    .folder .icon {
      --icon-main: #8f73b7;
      --icon-light: #c1a0dc;
      --icon-dark: #4b3a62;
      --icon-detail: var(--accent);
    }

    .archive-file .icon {
      --icon-main: #c99536;
      --icon-light: #edc15b;
      --icon-dark: #725121;
      --icon-detail: #312719;
    }

    .text-file .icon {
      --icon-main: #898394;
      --icon-light: #b8b0c1;
      --icon-dark: #4c4854;
      --icon-detail: #625a70;
    }

    .image-file .icon {
      --icon-main: #559d97;
      --icon-light: #85c9c0;
      --icon-dark: #285e5b;
      --icon-detail: var(--accent);
    }

    .database-file .icon {
      --icon-main: #607cae;
      --icon-light: #8fa8db;
      --icon-dark: #35486f;
      --icon-detail: #252d42;
    }

    .file-row:hover .filename,
    .file-row:focus-visible .filename { color: #fff; }

    .file-row:hover .icon,
    .file-row:focus-visible .icon {
      transform: translateX(2px);
      filter: brightness(1.12);
    }

    .size,
    .modified {
      color: var(--muted);
      font-size: 11px;
    }

    .empty-state {
      min-height: 110px;
      display: grid;
      place-items: center;
      color: var(--quiet);
      font-size: 11px;
      text-align: center;
    }

    .empty-state[hidden] { display: none; }
    .empty-query { color: var(--muted); }

    .footer {
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--quiet);
      font-size: 10px;
    }

    .footer-command {
      color: var(--muted);
    }

    .footer-command::before {
      content: ">";
      margin-right: 8px;
      color: var(--accent);
    }

    @media (max-width: 720px) {
      .page { width: min(calc(100% - 28px), var(--max)); }
      .hero { padding: 48px 0 34px; }

      .toolbar {
        padding: 13px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .tools { width: 100%; }
      .search { width: auto; flex: 1 1 auto; }

      .file-head,
      .file-row {
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 14px;
      }

      .file-head > :last-child,
      .file-row > :last-child { display: none; }

      .footer {
        flex-direction: column;
        gap: 5px;
      }
    }

    @media (max-width: 460px) {
      .status-label { display: none; }
      .top-actions { gap: 8px; }
      .intro { max-width: 36ch; }
      .action span.label { display: none; }
      .action { width: 32px; padding: 0; justify-content: center; }
      .tools { gap: 7px; }
      .actions { gap: 6px; }
      .file-head,
      .file-row { grid-template-columns: minmax(0, 1fr) 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>

  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-project">PROJECT</span>
        <span class="brand-mark"><span class="brand-thorn">Þ</span>ERXWOLD</span>
        <span class="slash">/</span>
        <span>files</span>
      </div>

      <div class="top-actions">
        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-label">public node</span>
        </div>
        <a class="login" href="/login">
          <svg class="pixel-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-login"/></svg>
          <span>log in</span>
        </a>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">node 01 · ~/archive</p>
      <h1><span class="title-prefix">#</span>file<span class="accent">.</span>manager</h1>
      <p class="intro">a quiet place for files, builds and things worth keeping around.</p>

    <section aria-label="File browser">

          </label>

          <div class="actions">
            <button class="action" type="button" aria-label="New folder">

            <button class="action primary" type="button" aria-label="Upload file">

            </span>
            <span class="filename">void_004.png</span>
          </span>
          <span class="size">812 kb</span>
          <span class="modified">28 jul</span>
        </button>

        <button class="file-row database-file" type="button" data-file data-name="archive.db">
          <span class="name">
            <span class="icon" aria-hidden="true">
              <svg class="pixel-icon" viewBox="0 0 16 16"><use href="#icon-database"/></svg>
            </span>
            <span class="filename">archive.db</span>
          </span>
          <span class="size">2.1 mb</span>
          <span class="modified">13 jul</span>
        </button>

        <div class="empty-state" id="empty-state" hidden>
          <span>no files matching <span class="empty-query" id="empty-query"></span></span>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span class="footer-command"><span id="visible-count">6</span> <span id="entry-label">entries</span> / 21.3 mb</span>
      <span>ÞERXWOLD // FILE NODE 01</span>
    </footer>
  </main>

  <script>
    const searchInput = document.querySelector("#file-search");
    const files = [...document.querySelectorAll("[data-file]")];
    const emptyState = document.querySelector("#empty-state");
    const emptyQuery = document.querySelector("#empty-query");
    const visibleCount = document.querySelector("#visible-count");
    const entryLabel = document.querySelector("#entry-label");

    function filterFiles() {
      const query = searchInput.value.trim().toLowerCase();
      let matches = 0;

      files.forEach((file) => {
        const isMatch = file.dataset.name.toLowerCase().includes(query);
        file.hidden = !isMatch;
        if (isMatch) matches += 1;
      });

      visibleCount.textContent = matches;
      entryLabel.textContent = matches === 1 ? "entry" : "entries";
      emptyState.hidden = matches !== 0;
      emptyQuery.textContent = query ? `“${searchInput.value.trim()}”` : "";
    }

    searchInput.addEventListener("input", filterFiles);

    document.addEventListener("keydown", (event) => {
      const isTyping = /input|textarea/i.test(document.activeElement.tagName);

      if (event.key === "/" && !isTyping) {
        event.preventDefault();
        searchInput.focus();
      }

      if (event.key === "Escape" && document.activeElement === searchInput) {
        searchInput.value = "";
        filterFiles();
        searchInput.blur();
      }
    });
  </script>
</body>
</html>
